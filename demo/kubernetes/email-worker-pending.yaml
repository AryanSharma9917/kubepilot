apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-worker
  namespace: notifications
  labels:
    app: email-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: email-worker
  template:
    metadata:
      labels:
        app: email-worker
    spec:
      containers:
        - name: email-worker
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: "1000"
              memory: "256Mi"
