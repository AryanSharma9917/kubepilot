replicaCount: 2

image:
  repository: ghcr.io/your-org/kubepilot-api
  tag: stable
  pullPolicy: IfNotPresent

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring

env:
  KUBEPILOT_ENVIRONMENT: production
  KUBEPILOT_K8S_MODE: in_cluster
  KUBEPILOT_ALLOWED_NAMESPACES: payments,platform,notifications
  KUBEPILOT_ALLOWED_ACTIONS: cluster:health,deployment:diagnose,deployment:incident-report
  KUBEPILOT_RAG_MODE: faiss
  KUBEPILOT_AGENT_MODE: langgraph
  KUBEPILOT_RATE_LIMIT_PER_MINUTE: "120"
  KUBEPILOT_OTEL_SERVICE_NAME: kubepilot-api

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi
