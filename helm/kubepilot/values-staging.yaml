replicaCount: 1

image:
  repository: ghcr.io/your-org/kubepilot-api
  tag: staging
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: kubepilot-staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: kubepilot-staging-tls
      hosts:
        - kubepilot-staging.example.com

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring

env:
  KUBEPILOT_ENVIRONMENT: staging
  KUBEPILOT_K8S_MODE: in_cluster
  KUBEPILOT_ALLOWED_NAMESPACES: payments,platform,notifications
  KUBEPILOT_ALLOWED_ACTIONS: cluster:health,deployment:diagnose,deployment:incident-report,deployment:remediation-plan
  KUBEPILOT_RAG_MODE: faiss
  KUBEPILOT_AGENT_MODE: langgraph
  KUBEPILOT_RATE_LIMIT_PER_MINUTE: "60"

envFromSecrets:
  - name: KUBEPILOT_API_KEYS
    secretName: kubepilot-api-secrets
    secretKey: api-keys
  - name: KUBEPILOT_LLM_ENDPOINT
    secretName: kubepilot-api-secrets
    secretKey: llm-endpoint

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
